<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder Path to Folder Name - My Toolkit</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'custom-dark': '#213448',
                        'custom-medium': '#547792',
                        'custom-light': '#94B4C1',
                        'custom-beige': '#EAE0CF',
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- 共用樣式 -->
    <link href="common.css" rel="stylesheet">

    <!-- 立即設定主題，避免頁面閃爍 -->
    <script>
            (function () {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            })();
    </script>

    <!-- 共用 JavaScript -->
    <script src="common.js"></script>

    <style>
        /* 輸入輸出區域樣式 */
        .input-area {
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background-color: var(--bg-secondary);
            transition: all 0.3s ease;
        }

        .input-area:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(84, 119, 146, 0.15);
        }

        .output-area {
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background-color: var(--bg-tertiary);
            transition: all 0.3s ease;
        }

        .output-text {
            font-family: 'Consolas', 'Monaco', monospace;
            word-break: break-all;
        }

        /* 複製成功動畫 */
        @keyframes copySuccess {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .copy-success {
            animation: copySuccess 0.3s ease;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col p-4 md:p-6 gap-6">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 rounded-xl shadow-sm"
        style="background-color: var(--bg-header); border: 1px solid var(--border-color); transition: all 0.3s ease;">
        <div class="flex items-center gap-3">
            <!-- Back to Home Link -->
            <a href="index.html" class="text-sm flex items-center gap-1 px-2 py-1 rounded-lg transition-all"
                style="color: var(--text-secondary);"
                onmouseover="this.style.backgroundColor='rgba(148, 180, 193, 0.15)'; this.style.color='var(--accent-primary)'"
                onmouseout="this.style.backgroundColor='transparent'; this.style.color='var(--text-secondary)'"
                title="返回首頁">
                <i class="fas fa-arrow-left text-xs"></i>
                <span class="hidden sm:inline">首頁</span>
            </a>
            <div class="w-10 h-10 bg-custom-medium rounded-lg flex items-center justify-center text-white text-xl">
                <i class="fas fa-route"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold" style="color: var(--text-primary); transition: color 0.3s ease;">Folder
                    Path to Folder Name</h1>
                <p class="text-xs" style="color: var(--text-secondary); transition: color 0.3s ease;">
                    將資料夾路徑轉換為資料夾名稱</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="themeToggle" onclick="toggleTheme()"
                class="px-4 py-2 text-sm rounded-lg transition border flex items-center gap-2"
                style="color: var(--text-primary); background: transparent; border-color: transparent;"
                onmouseover="this.style.backgroundColor='rgba(148, 180, 193, 0.15)'; this.style.borderColor='var(--border-color)'"
                onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='transparent'">
                <i id="themeIcon" class="fas fa-moon"></i>
                <span id="themeText">暗黑模式</span>
            </button>
            <button onclick="clearAll()" class="px-4 py-2 text-sm rounded-lg transition border"
                style="color: var(--text-primary); background: transparent; border-color: transparent;"
                onmouseover="this.style.backgroundColor='rgba(148, 180, 193, 0.15)'; this.style.borderColor='var(--border-color)'"
                onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='transparent'">
                <i class="fas fa-undo mr-1"></i> 清除
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col gap-6 max-w-3xl mx-auto w-full">

        <!-- Input Section -->
        <div class="flex flex-col gap-3">
            <label class="text-sm font-semibold text-custom-medium uppercase tracking-wider px-1">
                <i class="fas fa-folder-open mr-1"></i> 輸入路徑
            </label>
            <div class="input-area">
                <input type="text" id="pathInput" class="w-full p-4 text-base bg-transparent focus:outline-none"
                    style="color: var(--text-primary);"
                    placeholder="例如: \\FGIU001\website\msi.com\pages 或 C:\Users\Documents\folder"
                    onkeypress="if(event.key === 'Enter') convertPath()">
            </div>
        </div>

        <!-- Convert Button -->
        <div class="flex justify-center">
            <button onclick="convertPath()"
                class="px-8 py-3 text-base bg-custom-medium hover:bg-custom-dark text-white rounded-lg shadow-lg transition-all flex items-center gap-2 hover:scale-105">
                <i class="fas fa-exchange-alt"></i> 轉換
            </button>
        </div>

        <!-- Output Section -->
        <div class="flex flex-col gap-3">
            <label class="text-sm font-semibold text-custom-medium uppercase tracking-wider px-1">
                <i class="fas fa-folder mr-1"></i> 輸出名稱
            </label>
            <div class="output-area p-4 flex items-center justify-between gap-4">
                <span id="outputText" class="output-text flex-1 text-base"
                    style="color: var(--text-primary); min-height: 1.5rem;">
                    <!-- Output will appear here -->
                </span>
                <button id="copyBtn" onclick="copyOutput()"
                    class="px-4 py-2 text-sm bg-custom-medium hover:bg-custom-dark text-white rounded-lg shadow transition-all flex items-center gap-2 opacity-50 cursor-not-allowed"
                    disabled>
                    <i id="copyIcon" class="fas fa-copy"></i>
                    <span id="copyText">複製</span>
                </button>
            </div>
        </div>

        <!-- Usage Instructions -->
        <div class="rounded-xl border overflow-hidden mt-4"
            style="background: linear-gradient(to right, var(--bg-tertiary), var(--bg-secondary)); border-color: var(--border-color); transition: all 0.3s ease;">
            <button onclick="toggleInstructions()" class="w-full px-4 py-2 flex items-center justify-between transition"
                style="background: transparent;" onmouseover="this.style.backgroundColor='rgba(148, 180, 193, 0.1)'"
                onmouseout="this.style.backgroundColor='transparent'">
                <div class="flex items-center gap-2">
                    <i class="fas fa-question-circle text-sm" style="color: var(--text-tertiary);"></i>
                    <span class="text-xs" style="color: var(--text-tertiary);">使用說明</span>
                </div>
                <i id="instructionsIcon" class="fas fa-chevron-down text-xs transition-transform"
                    style="color: var(--text-tertiary);"></i>
            </button>

            <div id="instructionsContent" class="hidden px-4 pb-4 pt-2">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Conversion Rules -->
                    <div class="rounded-lg p-3 shadow-sm"
                        style="background-color: var(--bg-secondary); transition: background-color 0.3s ease;">
                        <h3 class="font-bold mb-2 flex items-center gap-2 text-sm" style="color: var(--text-primary);">
                            <i class="fas fa-exchange-alt text-custom-medium"></i>
                            轉換規則
                        </h3>
                        <ul class="space-y-1 text-xs" style="color: var(--text-primary);">
                            <li class="flex items-start gap-2">
                                <i class="fas fa-check text-green-600 mt-0.5"></i>
                                <span><code>\\</code> 開頭 → 直接移除</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <i class="fas fa-check text-green-600 mt-0.5"></i>
                                <span><code>\</code> → 替換為 <code>-</code></span>
                            </li>
                            <li class="flex items-start gap-2">
                                <i class="fas fa-check text-green-600 mt-0.5"></i>
                                <span><code>: / * ? " < > |</code> → 移除</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Examples -->
                    <div class="rounded-lg p-3 shadow-sm"
                        style="background-color: var(--bg-secondary); transition: background-color 0.3s ease;">
                        <h3 class="font-bold mb-2 flex items-center gap-2 text-sm" style="color: var(--text-primary);">
                            <i class="fas fa-lightbulb text-custom-medium"></i>
                            範例
                        </h3>
                        <ul class="space-y-1 text-xs" style="color: var(--text-primary);">
                            <li class="flex items-start gap-2">
                                <i class="fas fa-arrow-right text-custom-light mt-0.5"></i>
                                <span><code>\\FGIU001\site</code> → <code>FGIU001-site</code></span>
                            </li>
                            <li class="flex items-start gap-2">
                                <i class="fas fa-arrow-right text-custom-light mt-0.5"></i>
                                <span><code>C:\Users\Docs</code> → <code>C-Users-Docs</code></span>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Privacy Note -->
                <div class="mt-3 rounded-lg p-2 text-center" style="background-color: var(--bg-tertiary);">
                    <p class="text-xs flex items-center justify-center gap-2" style="color: var(--text-secondary);">
                        <i class="fas fa-shield-alt"></i>
                        <span>所有處理均在<strong>本機瀏覽器</strong>中進行，不會上傳至任何伺服器</span>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            document.getElementById('pathInput').focus();
        });

        // Theme toggle functionality
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');

            if (theme === 'dark') {
                icon.className = 'fas fa-moon';
                text.textContent = '暗黑模式';
            } else {
                icon.className = 'fas fa-sun';
                text.textContent = '明亮模式';
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        // Toggle instructions panel
        function toggleInstructions() {
            const content = document.getElementById('instructionsContent');
            const icon = document.getElementById('instructionsIcon');

            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // Convert path to folder name
        function convertPath() {
            const input = document.getElementById('pathInput').value;
            const outputText = document.getElementById('outputText');
            const copyBtn = document.getElementById('copyBtn');

            if (!input.trim()) {
                outputText.textContent = '';
                copyBtn.disabled = true;
                copyBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            // Conversion logic
            let result = input;

            // 1. Remove leading \\ (UNC path)
            if (result.startsWith('\\\\')) {
                result = result.substring(2);
            }

            // 2. Remove all invalid Windows folder name characters: \ / : * ? " < > |
            // First, replace \ with -
            result = result.replace(/\\/g, '-');

            // Then remove other invalid characters: / : * ? " < > |
            result = result.replace(/[/:*?"<>|]/g, '');

            // 3. Clean up: remove leading/trailing dashes and multiple consecutive dashes
            result = result.replace(/^-+|-+$/g, '');
            result = result.replace(/-{2,}/g, '-');

            // Display result
            outputText.textContent = result;

            // Enable copy button
            if (result) {
                copyBtn.disabled = false;
                copyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Copy output to clipboard
        async function copyOutput() {
            const outputText = document.getElementById('outputText').textContent;
            const copyBtn = document.getElementById('copyBtn');
            const copyIcon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');

            if (!outputText) return;

            try {
                await navigator.clipboard.writeText(outputText);

                // Success feedback
                copyBtn.classList.add('copy-success');
                copyIcon.className = 'fas fa-check';
                copyText.textContent = '已複製';

                setTimeout(() => {
                    copyBtn.classList.remove('copy-success');
                    copyIcon.className = 'fas fa-copy';
                    copyText.textContent = '複製';
                }, 1500);
            } catch (err) {
                console.error('Copy failed:', err);
                copyText.textContent = '複製失敗';
                setTimeout(() => {
                    copyText.textContent = '複製';
                }, 1500);
            }
        }

        // Clear all
        function clearAll() {
            document.getElementById('pathInput').value = '';
            document.getElementById('outputText').textContent = '';
            document.getElementById('copyBtn').disabled = true;
            document.getElementById('copyBtn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('pathInput').focus();
        }
    </script>

</body>

</html>
