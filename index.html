<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Toolkit - 線上工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        .tool-card {
            transition: all 0.3s ease;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                        <i class="fas fa-toolbox text-sm"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-800">My Toolkit</span>
                </div>
                <div class="flex items-center">
                    <a href="https://github.com/f88083" target="_blank" class="text-slate-500 hover:text-indigo-600 transition">
                        <i class="fab fa-github text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="bg-indigo-600 py-16 sm:py-24">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-4">
                簡單、好用的線上工具集
            </h1>
            <p class="text-indigo-100 text-lg sm:text-xl max-w-2xl mx-auto">
                這裡收集了我開發的各種網頁小工具，無需安裝，打開瀏覽器即可使用。
            </p>
        </div>
    </div>

    <!-- Tools Grid -->
    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 -mt-10 mb-16 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- Tool 1: Markdown Table Generator -->
            <a href="tableToMarkdown.html" class="tool-card block bg-white rounded-xl overflow-hidden border border-slate-200 shadow-sm group">
                <div class="h-2 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
                <div class="p-6">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-600 text-xl group-hover:scale-110 transition-transform">
                            <i class="fas fa-table"></i>
                        </div>
                        <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-medium">已上線</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2 group-hover:text-indigo-600 transition-colors">Markdown 表格生成器</h3>
                    <p class="text-slate-500 text-sm leading-relaxed">
                        視覺化的表格編輯器，支援右鍵選單操作，可快速將 Excel 或手動輸入的內容轉為 Markdown 語法。
                    </p>
                </div>
                <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex items-center justify-between">
                    <span class="text-xs text-slate-400 font-medium">生產力工具</span>
                    <i class="fas fa-arrow-right text-slate-300 group-hover:text-indigo-500 transition-colors"></i>
                </div>
            </a>

            <!-- Tool 2: Placeholder (Coming Soon) -->
            <div class="tool-card block bg-white rounded-xl overflow-hidden border border-slate-200 border-dashed shadow-sm opacity-75">
                <div class="h-2 bg-slate-200"></div>
                <div class="p-6">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400 text-xl">
                            <i class="fas fa-wrench"></i>
                        </div>
                        <span class="bg-slate-100 text-slate-500 text-xs px-2 py-1 rounded-full font-medium">開發中</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-400 mb-2">JSON 格式化工具</h3>
                    <p class="text-slate-400 text-sm leading-relaxed">
                        (預計新增) 貼上亂碼般的 JSON 字串，一鍵美化並檢查語法錯誤。
                    </p>
                </div>
                <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex items-center justify-between">
                    <span class="text-xs text-slate-300 font-medium">開發者工具</span>
                </div>
            </div>

            <!-- Tool 3: Placeholder (More) -->
            <div class="flex flex-col items-center justify-center p-6 text-center border-2 border-dashed border-slate-200 rounded-xl text-slate-400 hover:border-indigo-300 hover:text-indigo-500 transition-colors cursor-default">
                <i class="fas fa-plus-circle text-3xl mb-3"></i>
                <p class="font-medium">更多工具製作中...</p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8">
        <div class="max-w-6xl mx-auto px-4 text-center text-slate-500 text-sm">
            <p>&copy; 2024 My Toolkit. Hosted on GitHub Pages.</p>
        </div>
    </footer>

</body>
</html>
